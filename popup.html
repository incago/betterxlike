<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionName">Better X Likes</title>
    <link rel="stylesheet" href="popup.css">
    <script src="pages.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" width="40" height="40" alt="">
      <div><h1 data-i18n="extensionName">Better X Likes</h1><p data-i18n="popupTagline">Browse X posts at a glance.</p></div>
    </header>
    <label class="setting" for="enabled">
      <div><strong data-i18n="gridEnabled">Enable grid</strong><span data-i18n="masterHint">Master switch for all pages</span></div>
      <input type="checkbox" id="enabled" role="switch" checked disabled>
      <span class="switch" aria-hidden="true"></span>
    </label>
    <fieldset id="page-settings" disabled>
      <legend data-i18n="pageSettings">Layout by page</legend>
      <label for="mode-home"><span data-i18n="pageHome">Home</span><select id="mode-home" data-page="home"><option data-i18n="layoutGrid" value="grid">Grid</option><option data-i18n="layoutNative" value="native">Default list</option></select></label>
      <label for="mode-search"><span data-i18n="pageSearch">Search results</span><select id="mode-search" data-page="search"><option data-i18n="layoutGrid" value="grid">Grid</option><option data-i18n="layoutNative" value="native">Default list</option></select></label>
      <label for="mode-profile"><span data-i18n="pageProfile">Profiles</span><select id="mode-profile" data-page="profile"><option data-i18n="layoutGrid" value="grid">Grid</option><option data-i18n="layoutNative" value="native">Default list</option></select></label>
      <label for="mode-bookmarks"><span data-i18n="pageBookmarks">Bookmarks</span><select id="mode-bookmarks" data-page="bookmarks"><option data-i18n="layoutGrid" value="grid">Grid</option><option data-i18n="layoutNative" value="native">Default list</option></select></label>
      <label for="mode-likes"><span data-i18n="pageLikes">Likes</span><select id="mode-likes" data-page="likes"><option data-i18n="layoutGrid" value="grid">Grid</option><option data-i18n="layoutNative" value="native">Default list</option></select></label>
    </fieldset>
    <p data-i18n="statusLoading" id="status" role="status" aria-live="polite">Loading settings…</p>
    <a class="open-likes" href="https://x.com/i/history" target="_blank" rel="noopener noreferrer"><span data-i18n="openBookmarks">Open my bookmarks</span> <span aria-hidden="true">↗</span></a>
    <a class="open-likes" href="https://x.com/i/history/likes" target="_blank" rel="noopener noreferrer"><span data-i18n="openLikes">Open my likes</span> <span aria-hidden="true">↗</span></a>
    <footer><span data-i18n="gridSummary">Grid: 1–4 columns · No sidebar · Click to play</span><br><span data-i18n="profileHint">Applies to your profile and other profiles</span></footer>
  </body>
</html>
